<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      .body {
        margin-top: 0px;;
        margin-bottom: 0px;
      }
      .button-container {
        background-color: rgb(25, 135, 84);
        color: white;
        margin-left: 10px;
        height: 25px;
      }
      .buttons-container {
        display:flex;
        justify-content: center;
        height: 100vh;
        background-color: rgb(222, 222, 222);
        align-items: center;
      }
    </style>
    
  </head>
  <body>
    <div class="js-container"></div>


    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function App () {
        const [counter, setCounter] = React.useState(0)
        const buttonRef = React.useRef();
        return (
        <div className={'buttons-container'}>
        <button className={'button-container'} ref={buttonRef} onClick={()=>{setCounter(counter+1)}}>Clicked {counter} times</button>
        <button className={'button-container'} onClick={()=>{setCounter(0)}}>Reset</button>
        <button className={'button-container'} onClick={()=>{setInterval(()=>{buttonRef.current.click()},1000)}}>Auto Click</button>

        </div>
        )
      } 
      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);
      root.render(<App />);

    </script>
  </body>
</html>
